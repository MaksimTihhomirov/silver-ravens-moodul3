<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart | The Silver Ravens</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/cart.js" defer></script>
</head>
<body>

    <header class="header container">

        <a href="index.html" class="logo">
            <img src="assets/images/SilverRavens-logo.svg"
                 alt="The Silver Ravens logo">
        </a>

        <nav class="navigation" aria-label="Main navigation">
            <a href="index.html">HOME</a>
            <a href="shop.html">SHOP</a>
            <a href="contact.html">CONTACT</a>
            <a href="cart.html">CART</a>
        </nav>

    </header>

    <main class="container cart-page">

        <h1>SHOPPING CART</h1>

        <section id="cart-items" class="cart-items"
                 aria-label="Shopping cart items">
        </section>

        <section class="cart-summary">

            <div class="cart-total">
                <h2>TOTAL</h2>
                <strong id="cart-total">$0.00</strong>
            </div>

            <a href="shop.html" class="button">
                CONTINUE SHOPPING
            </a>

        </section>

    </main>

    <footer class="footer container">

        <div class="footer-top">

            <div class="footer-brand">

                <a href="index.html">
                    <img src="assets/images/SilverRavens-logo.svg"
                         alt="The Silver Ravens logo"
                         class="footer-logo">
                </a>

                <div class="footer-brand-text">
                    <h2>THE SILVER RAVENS</h2>
                    <p>Official merchandise store</p>
                </div>

            </div>

            <nav class="footer-navigation" aria-label="Footer navigation">
                <a href="index.html">HOME</a>
                <a href="shop.html">SHOP</a>
                <a href="contact.html">CONTACT</a>
                <a href="cart.html">CART</a>
            </nav>

        </div>

        <div class="footer-bottom">
            <p>© 2026 The Silver Ravens. All rights reserved.</p>
        </div>

    </footer>

</body>
</html>
